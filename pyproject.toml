[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fanyiji-voice-next"
version = "0.5.2"
description = "翻译姬独立语音版：本地中日语音识别、互译和双路字幕"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6-Essentials==6.12.0", "shiboken6==6.12.0"]

[project.optional-dependencies]
voice = [
  "numpy==2.5.3", "sherpa-onnx==1.13.8", "ctranslate2==4.8.2",
  "sentencepiece==0.2.2", "PyAudioWPatch==0.2.12.9", "soxr==1.1.0",
  "faster-whisper==1.2.1", "tokenizers==0.22.2",
]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3"]
gpu = [
  "nvidia-cublas-cu12==12.4.5.8; sys_platform == 'win32'",
  "nvidia-cudnn-cu12==9.10.2.21; sys_platform == 'win32'",
]

[project.scripts]
fanyiji-voice-next = "fanyiji_next.app:main"
fanyiji-voice-prototype = "fanyiji_next.prototype:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
